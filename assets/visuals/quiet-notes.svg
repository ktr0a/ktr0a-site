<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="still" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="qn-t qn-d">
  <title id="qn-t">Quiet Notes on a 13-inch tablet</title>
  <desc id="qn-d">A tablet lying on a dark desk next to its stylus. The calm paper canvas shows an annotated PDF exercise page on the left and handwritten notes on the right: the sum of i from 1 to n equals n(n+1)/2, a recursion tree with log n levels of cost n each, and the boxed result Theta(n log n). A single round button floats in the corner.</desc>
  <!--
    Hand-authored illustration for the Quiet Notes project card (ktr0a.dev).
    Every handwritten mark is a single-stroke path (glyphs live in <defs> and are
    placed with <use>). Self-contained, no scripts. CSS-only animation: the blue
    underline and the result box are re-inked on a slow 9 s loop via stroke-dashoffset.
    Load as "quiet-notes.svg#still" to freeze it (strokes then show fully drawn).
  -->
  <defs>
    <style>
      .ink{fill:none;stroke:#1e2128;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .blue{fill:none;stroke:#2b63e6;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .thin{stroke-width:1.9}

      /* re-inking: the blue underline, then the result box, are drawn in, held, faded, repeated.
         Dash lengths are the paths' real lengths (pathLength is avoided for older Safari). */
      .draw{animation:9s cubic-bezier(.5,0,.3,1) infinite}
      .draw.u{stroke-dasharray:204 260;animation-name:ink-u}
      .draw.bx{stroke-dasharray:364 420;animation-name:ink-bx}
      @keyframes ink-u{0%{stroke-dashoffset:210;opacity:1}10%{stroke-dashoffset:0}84%{opacity:1}92%,100%{stroke-dashoffset:0;opacity:0}}
      @keyframes ink-bx{0%,13%{stroke-dashoffset:370;opacity:1}27%{stroke-dashoffset:0}84%{opacity:1}92%,100%{stroke-dashoffset:0;opacity:0}}

      #still:target *{animation:none!important}
    </style>

    <radialGradient id="qn-bg" cx="400" cy="290" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#161a24"/>
      <stop offset=".55" stop-color="#0d0f13"/>
      <stop offset="1" stop-color="#09090b"/>
    </radialGradient>
    <radialGradient id="qn-halo" cx="400" cy="300" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3d7bff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#3d7bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="qn-shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#000" stop-opacity=".7"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="qn-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c2f36"/>
      <stop offset=".5" stop-color="#1c1e23"/>
      <stop offset="1" stop-color="#141519"/>
    </linearGradient>
    <linearGradient id="qn-glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".0"/>
      <stop offset=".42" stop-color="#fff" stop-opacity=".0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".09"/>
      <stop offset=".62" stop-color="#fff" stop-opacity=".0"/>
    </linearGradient>
    <linearGradient id="qn-screenshade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".06"/>
      <stop offset=".12" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="qn-pen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5f69"/>
      <stop offset=".35" stop-color="#2e3137"/>
      <stop offset="1" stop-color="#16181c"/>
    </linearGradient>
    <linearGradient id="qn-tip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4e6ea"/>
      <stop offset="1" stop-color="#9097a1"/>
    </linearGradient>
    <pattern id="qn-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".9" fill="#fff" fill-opacity=".045"/>
    </pattern>
    <pattern id="qn-paper" x="86" y="104" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r=".85" fill="#2a2a2a" fill-opacity=".14"/>
    </pattern>
    <clipPath id="qn-screen"><rect x="86" y="104" width="628" height="392" rx="14"/></clipPath>

    <!-- ===== single-stroke glyphs (baseline y=0, x-height ~15) ===== -->
    <path id="g-n" d="M0 -13.5C1.3 -15.4 2.6 -14.6 2.6 -12.4L2.4 0C2.9 -7.5 5.6 -15 9.6 -15.2C13 -15.3 13.2 -10.5 13.2 -6.5C13.2 -3.5 13.4 -1 15 .2"/>
    <path id="g-i" d="M1.6 -14C1.4 -9.5 1.2 -4.5 1.8 -1.6C2.3 .8 4.4 .6 5.8 -1.2M1.7 -21.4L2.3 -20.8"/>
    <path id="g-eq" d="M0 -12C5.5 -12.7 11 -12.6 16.5 -12.1M.6 -4.8C6.2 -5.4 11.6 -5.2 17 -4.7"/>
    <path id="g-lp" d="M6.5 -22C.8 -15.5 -.6 -3 5.2 5.5"/>
    <path id="g-rp" d="M0 -22C5.7 -15.5 7.1 -3 1.3 5.5"/>
    <path id="g-plus" d="M6.2 -14.5C6.1 -9.5 6 -5 6.1 .5M-.3 -6.8C4 -7.2 8.4 -7.2 12.8 -6.9"/>
    <path id="g-1" d="M0 -16.8C2.2 -18.4 4.2 -20.4 5.6 -22.4C5.4 -15 5.2 -7.5 5.4 0"/>
    <path id="g-2" d="M.6 -16.4C1.6 -21.2 6.2 -23.2 9.8 -21.6C13.2 -20 13 -15.6 10.6 -12C8.2 -8.2 3.6 -3.8 0 .2C4.6 -.6 9.2 -.6 14.2 .1"/>
    <path id="g-sigma" d="M30 -28.5C21 -30.2 10 -30.4 1.6 -29.2C8.4 -21.6 13 -15 16.2 -8.6C11.2 -1.8 6 4.6 0 12.6C10.4 11.6 20.6 11.8 31.4 12.8"/>
    <path id="g-l" d="M-1 -1.5C3 -7.5 7.6 -16.5 6.8 -22.4C6.2 -26.2 2.2 -25 1.6 -18.4C1 -11.2 1.2 -4.4 2.4 -1.2C3.2 1 5.2 .6 6.6 -.8"/>
    <path id="g-o" d="M8 -14.2C3.8 -16.8 -.4 -12.6 .1 -6.6C.5 -1.6 5.2 .6 8.4 -2.6C11.2 -5.6 10.8 -12.2 7.6 -14.8C6.2 -15.8 4.6 -15.4 3.8 -14.6"/>
    <path id="g-g" d="M10.2 -12.4C8.2 -16.2 1.2 -15.6 .6 -9.2C.2 -3.6 5.6 -2.6 8.6 -6.2C9.8 -7.8 10.2 -10.2 10.4 -14.8C10.5 -8.2 10.6 -1 10.2 4.2C9.8 9.8 3.6 10.8 .6 6.8"/>
    <path id="g-theta" d="M7.2 -22.2C1.2 -22.2 -.4 -14.2 .1 -9C.7 -2 4.2 .8 7.6 .4C12.2 0 14.4 -6 14.2 -11.6C14 -17.6 11.2 -22.6 7.2 -22.2M2.4 -11.2C5.6 -11.8 9.2 -11.8 12.2 -11.4"/>
    <path id="g-check" d="M0 -6.5C1.8 -4.6 3.2 -2.6 4.4 0C7 -6.2 10.6 -12.4 15.2 -16.6"/>
    <!-- hand-drawn circle, r ~10, slightly open with an overshoot -->
    <path id="g-circ" d="M8.6 -5.2C5.4 -10.4 -3.6 -11.2 -8.2 -6.2C-12 -1.8 -9.8 7 -3.6 9.4C3.2 12 10.6 6.6 10.2 -.4C10 -3.6 8.4 -6.4 5.2 -8.4"/>
  </defs>

  <!-- ===== desk ===== -->
  <rect width="800" height="600" fill="url(#qn-bg)"/>
  <rect width="800" height="600" fill="url(#qn-dots)"/>
  <rect width="800" height="600" fill="url(#qn-halo)"/>

  <g transform="rotate(-3 400 300)">
    <!-- contact shadow -->
    <ellipse cx="400" cy="514" rx="360" ry="30" fill="url(#qn-shadow)"/>

    <!-- ===== tablet body ===== -->
    <rect x="66" y="84" width="668" height="432" rx="32" fill="url(#qn-body)"/>
    <rect x="66.5" y="84.5" width="667" height="431" rx="31.5" fill="none" stroke="#fff" stroke-opacity=".17"/>
    <rect x="68.5" y="86.5" width="663" height="427" rx="29.5" fill="none" stroke="#000" stroke-opacity=".45"/>
    <!-- buttons on the top edge + camera -->
    <rect x="600" y="82" width="34" height="2.5" rx="1.2" fill="#3a3d44"/>
    <rect x="646" y="82" width="20" height="2.5" rx="1.2" fill="#3a3d44"/>
    <circle cx="400" cy="94" r="2.6" fill="#08090b"/>
    <circle cx="399.3" cy="93.3" r=".8" fill="#3b4558"/>

    <!-- ===== screen ===== -->
    <g clip-path="url(#qn-screen)">
      <rect x="86" y="104" width="628" height="392" fill="#e8e6df"/>
      <rect x="86" y="104" width="628" height="392" fill="url(#qn-paper)"/>

      <!-- imported PDF page (left), only its top and right edge visible -->
      <rect x="108" y="124" width="222" height="400" fill="#000" fill-opacity=".05"/>
      <rect x="106" y="122" width="222" height="400" fill="#000" fill-opacity=".05"/>
      <rect x="104" y="120" width="222" height="400" fill="#f8f7f3"/>
      <g fill="#a9a59c">
        <rect x="120" y="136" width="46" height="4" rx="1"/>
        <rect x="282" y="136" width="30" height="4" rx="1"/>
      </g>
      <rect x="120" y="152" width="118" height="9" rx="1.5" fill="#55524c"/>
      <rect x="120" y="168" width="76" height="5" rx="1" fill="#a9a59c"/>
      <!-- highlighter swipe (sits under the printed line, reads like multiply) -->
      <path d="M118 266.5C170 265.2 232 266.2 298 265.3" fill="none" stroke="#ffb020" stroke-opacity=".5" stroke-width="10"/>
      <g fill="#cbc8bf">
        <rect x="120" y="190" width="190" height="4" rx="1"/>
        <rect x="120" y="201" width="182" height="4" rx="1"/>
        <rect x="120" y="212" width="188" height="4" rx="1"/>
        <rect x="120" y="223" width="110" height="4" rx="1"/>
        <rect x="142" y="245" width="126" height="5" rx="1"/>
        <rect x="120" y="264" width="176" height="4" rx="1"/>
        <rect x="120" y="275" width="190" height="4" rx="1"/>
        <rect x="120" y="286" width="138" height="4" rx="1"/>
        <rect x="142" y="333" width="104" height="5" rx="1"/>
        <rect x="120" y="351" width="186" height="4" rx="1"/>
        <rect x="120" y="362" width="182" height="4" rx="1"/>
        <rect x="120" y="373" width="174" height="4" rx="1"/>
        <rect x="120" y="384" width="96" height="4" rx="1"/>
        <rect x="142" y="410" width="118" height="5" rx="1"/>
        <rect x="120" y="428" width="190" height="4" rx="1"/>
        <rect x="120" y="439" width="184" height="4" rx="1"/>
        <rect x="120" y="450" width="188" height="4" rx="1"/>
        <rect x="120" y="461" width="160" height="4" rx="1"/>
        <rect x="120" y="472" width="186" height="4" rx="1"/>
        <rect x="120" y="483" width="120" height="4" rx="1"/>
      </g>
      <g fill="#7b776f">
        <rect x="120" y="244" width="16" height="7" rx="1"/>
        <rect x="120" y="332" width="16" height="7" rx="1"/>
        <rect x="120" y="409" width="16" height="7" rx="1"/>
        <!-- printed display formula -->
        <rect x="168" y="304" width="34" height="6" rx="1"/>
        <rect x="208" y="304.5" width="10" height="1.6"/>
        <rect x="208" y="308" width="10" height="1.6"/>
        <rect x="224" y="304" width="52" height="6" rx="1"/>
      </g>
      <!-- pen marks on the PDF -->
      <use href="#g-circ" xlink:href="#g-circ" class="blue thin" transform="translate(129 335.5) scale(1.45 .95)"/>
      <use href="#g-check" xlink:href="#g-check" class="blue thin" transform="translate(296 252) scale(.8)"/>

      <!-- ===== handwritten notes ===== -->
      <!-- Σ_{i=1}^{n} i = n(n+1) / 2 -->
      <g class="ink" transform="translate(368 196) skewX(-7)">
        <use href="#g-sigma" xlink:href="#g-sigma"/>
        <use href="#g-n" xlink:href="#g-n" transform="translate(9 -36) scale(.62)"/>
        <use href="#g-i" xlink:href="#g-i" transform="translate(1 31) scale(.62)"/>
        <use href="#g-eq" xlink:href="#g-eq" transform="translate(7.5 31) scale(.62)"/>
        <use href="#g-1" xlink:href="#g-1" transform="translate(21 31) scale(.62)"/>
        <use href="#g-i" xlink:href="#g-i" x="42"/>
        <use href="#g-eq" xlink:href="#g-eq" x="58"/>
        <use href="#g-n" xlink:href="#g-n" transform="translate(92 -18)"/>
        <use href="#g-lp" xlink:href="#g-lp" transform="translate(110 -18)"/>
        <use href="#g-n" xlink:href="#g-n" transform="translate(119 -18)"/>
        <use href="#g-plus" xlink:href="#g-plus" transform="translate(138 -18)"/>
        <use href="#g-1" xlink:href="#g-1" transform="translate(155 -18)"/>
        <use href="#g-rp" xlink:href="#g-rp" transform="translate(164 -18)"/>
        <path d="M86 -8C112 -9.4 146 -9.2 178 -8.4"/>
        <use href="#g-2" xlink:href="#g-2" transform="translate(125 20)"/>
      </g>
      <!-- animated underline -->
      <path class="blue draw u" d="M360 240C404 236.6 474 236.8 552 234.2C556 234 559.5 232.6 562 229.6"/>

      <!-- recursion tree -->
      <g class="ink">
        <use href="#g-circ" xlink:href="#g-circ" transform="translate(520 276)"/>
        <use href="#g-circ" xlink:href="#g-circ" transform="translate(472 320) scale(.9)"/>
        <use href="#g-circ" xlink:href="#g-circ" transform="translate(568 320) scale(.9)"/>
        <use href="#g-circ" xlink:href="#g-circ" transform="translate(448 362) scale(.8)"/>
        <use href="#g-circ" xlink:href="#g-circ" transform="translate(496 362) scale(.8)"/>
        <use href="#g-circ" xlink:href="#g-circ" transform="translate(544 362) scale(.8)"/>
        <use href="#g-circ" xlink:href="#g-circ" transform="translate(592 362) scale(.8)"/>
        <path d="M513 283.5C503 292 490 302 478.5 312.5M527 283.5C537 292 550 302 561.5 312.5M467 327.5C462 337 457 346 452 355M477 327.5C482 337 487 346 492 355M563 327.5C558 337 553 346 548 355M573 327.5C578 337 583 346 588 355"/>
        <path stroke-width="3" d="M440 392h.1M452 392h.1M464 392h.1M476 392h.1M488 392h.1M500 392h.1M512 392h.1M524 392h.1M536 392h.1M548 392h.1M560 392h.1M572 392h.1M584 392h.1M596 392h.1"/>
        <use href="#g-n" xlink:href="#g-n" transform="translate(514.5 281) scale(.5)"/>
      </g>
      <!-- per-level cost and depth, in blue -->
      <g class="blue thin">
        <path d="M612 276h12M612 320h12M612 362h12"/>
        <use href="#g-n" xlink:href="#g-n" transform="translate(632 282) scale(.78)"/>
        <use href="#g-n" xlink:href="#g-n" transform="translate(632 326) scale(.78)"/>
        <use href="#g-n" xlink:href="#g-n" transform="translate(632 368) scale(.78)"/>
        <path d="M432 268C424 268 425 276 425 290C425 318 424 326 418 330C424 334 425 342 425 370C425 384 424 392 432 392"/>
        <g transform="translate(358 335) scale(.82) skewX(-7)">
          <use href="#g-l" xlink:href="#g-l"/>
          <use href="#g-o" xlink:href="#g-o" x="9"/>
          <use href="#g-g" xlink:href="#g-g" x="22"/>
          <use href="#g-n" xlink:href="#g-n" x="43"/>
        </g>
      </g>

      <!-- = Θ(n log n), boxed -->
      <g class="ink" transform="translate(456 442) skewX(-7)">
        <use href="#g-eq" xlink:href="#g-eq" x="-7"/>
        <use href="#g-theta" xlink:href="#g-theta" x="26"/>
        <use href="#g-lp" xlink:href="#g-lp" x="44"/>
        <use href="#g-n" xlink:href="#g-n" x="53"/>
        <use href="#g-l" xlink:href="#g-l" x="77"/>
        <use href="#g-o" xlink:href="#g-o" x="86"/>
        <use href="#g-g" xlink:href="#g-g" x="99"/>
        <use href="#g-n" xlink:href="#g-n" x="119"/>
        <use href="#g-rp" xlink:href="#g-rp" x="138"/>
      </g>
      <path class="blue draw bx" d="M482 412.5C526 410.6 574 410.4 610 411.8C613.4 422 613.6 444 611.4 457.2C566 458.6 522 458.8 478.6 457.4C476.4 444 476.6 424 479.4 413.4C481.6 411.6 486 411.4 492 411.6"/>

      <!-- the one on-canvas button -->
      <circle cx="684" cy="469" r="21" fill="#000" fill-opacity=".14"/>
      <circle cx="684" cy="467" r="20" fill="#1d2026"/>
      <circle cx="684" cy="467" r="16.5" fill="none" stroke="#2b63e6" stroke-width="1.6"/>
      <path d="M678.2 473.2l1.3-4.6 7.2-7.2a1.7 1.7 0 0 1 2.4 0l.9.9a1.7 1.7 0 0 1 0 2.4l-7.2 7.2z" fill="none" stroke="#f3f4f6" stroke-width="1.5" stroke-linejoin="round"/>

      <!-- glass: soft glare and edge shading -->
      <rect x="86" y="104" width="628" height="392" fill="url(#qn-glare)"/>
      <rect x="86" y="104" width="628" height="392" fill="url(#qn-screenshade)"/>
    </g>
    <rect x="86.5" y="104.5" width="627" height="391" rx="13.5" fill="none" stroke="#000" stroke-opacity=".55"/>

    <!-- ===== stylus ===== -->
    <g transform="rotate(-2.5 500 552)">
      <rect x="352" y="551" width="290" height="10" rx="5" fill="#000" fill-opacity=".45"/>
      <rect x="350" y="541" width="252" height="12" rx="6" fill="url(#qn-pen)"/>
      <path d="M358 544.2H594" stroke="#fff" stroke-opacity=".2"/>
      <rect x="378" y="541" width="3" height="12" fill="#3d7bff" fill-opacity=".85"/>
      <path d="M601 541.2L627 545.6Q630.4 547 627 548.4L601 552.8Z" fill="url(#qn-tip)"/>
      <circle cx="629" cy="547" r="1.4" fill="#2a2d33"/>
    </g>
  </g>
</svg>
