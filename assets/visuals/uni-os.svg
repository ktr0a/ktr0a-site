<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="still" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="uos-t uos-d">
  <title id="uos-t">Uni OS system map</title>
  <desc id="uos-d">A coordinator agent wired to six role agents (planner, tracker, A&amp;D, DM, LA and EProg help) running as tmux panes on the uni-vm Google Cloud machine. Work flows through a single sync/apply job into the 690-note vault, which git snapshots hourly; the tracker sends budgeted phone pushes via ntfy.</desc>
  <!--
    Hand-authored illustration for the Uni OS project card (ktr0a.dev).
    Self-contained: no scripts, no external refs. Animation is CSS only and cheap
    (stroke-dashoffset packets, opacity/transform pings). Load the file as
    "uni-os.svg#still" to freeze every animation (root :target switch).
  -->
  <defs>
    <style>
      .m{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .s{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .ln{fill:none;stroke:url(#uos-edge);stroke-width:1.1}
      .ln.push{stroke-dasharray:2 4;stroke:rgba(255,176,32,.42)}
      .node{fill:#111318;stroke:rgba(255,255,255,.14);stroke-width:1}
      .node.active{stroke:rgba(34,224,122,.55)}
      .bar{fill:rgba(255,255,255,.035)}
      .ttl{font-size:14px;font-weight:600;fill:#eceef2}
      .idx{font-size:10px;fill:#4f5562}
      .log{font-size:11px;fill:#7d8592}
      .card{fill:#111318;stroke:rgba(255,255,255,.12);stroke-width:1}
      .sub{font-size:10.5px;fill:#7d8592}

      /* packets: an 8px dash travelling at constant speed; hidden before/after the run */
      .pk{fill:none;stroke-linecap:round;stroke-dasharray:8 1200;stroke-dashoffset:14;
          animation:pk 4.2s cubic-bezier(.45,.05,.55,.95) infinite}
      .pk.h{stroke:#3d7bff;stroke-width:7;opacity:.42}
      .pk.c{stroke:#e8efff;stroke-width:2.4}
      .pk.am.h{stroke:#ffb020}
      .pk.am.c{stroke:#ffe2a6}
      .rev{animation-direction:reverse}
      @keyframes pk{0%{stroke-dashoffset:14}62%,100%{stroke-dashoffset:-430}}

      .ping{transform-box:fill-box;transform-origin:center;animation:ping 2.6s ease-out infinite}
      @keyframes ping{0%{transform:scale(1);opacity:.7}70%,100%{transform:scale(3.4);opacity:0}}
      .caret{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .spin{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      .beat{animation:beat 3.2s ease-in-out infinite}
      @keyframes beat{0%,100%{opacity:.35}50%{opacity:1}}

      /* "#still" fragment freezes everything (e.g. when the site's animation toggle is off) */
      #still:target *{animation:none!important}
    </style>

    <radialGradient id="uos-bg" cx="296" cy="265" r="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#151a26"/>
      <stop offset=".55" stop-color="#0e1015"/>
      <stop offset="1" stop-color="#0a0b0d"/>
    </radialGradient>
    <radialGradient id="uos-hubglow" cx="296" cy="265" r="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3d7bff" stop-opacity=".26"/>
      <stop offset=".45" stop-color="#3d7bff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#3d7bff" stop-opacity="0"/>
    </radialGradient>
    <!-- edges glow blue near the coordinator and cool to grey hairlines further out -->
    <radialGradient id="uos-edge" cx="296" cy="265" r="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6c9bff" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#3d7bff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".16"/>
    </radialGradient>
    <linearGradient id="uos-hubfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2b55"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <pattern id="uos-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".9" fill="#fff" fill-opacity=".05"/>
    </pattern>

    <!-- edge geometry, shared by the hairline, the packet halo and the packet core -->
    <path id="e-plan" d="M296 265V124"/>
    <path id="e-dm" d="M296 265V406"/>
    <path id="e-trk" d="M296 252H388C440 252 484 248 484 196"/>
    <path id="e-ad" d="M296 278H388C440 278 484 282 484 334"/>
    <path id="e-ep" d="M296 252H204C152 252 108 248 108 196"/>
    <path id="e-la" d="M296 278H204C152 278 108 282 108 334"/>
    <path id="e-sync" d="M296 265H682"/>
    <path id="e-vault" d="M682 265V377"/>
    <path id="e-git" d="M682 377V494"/>
    <path id="e-ntfy" d="M484 182H566Q578 182 578 170V132Q578 120 590 120H682"/>
  </defs>

  <!-- ===== backdrop ===== -->
  <rect width="800" height="600" fill="url(#uos-bg)"/>
  <rect width="800" height="600" fill="url(#uos-dots)"/>

  <!-- ===== header ===== -->
  <g class="m">
    <rect x="28.75" y="24.75" width="11.5" height="11.5" rx="3" fill="none" stroke="#3d7bff" stroke-width="1.5"/>
    <rect x="32.5" y="28.5" width="4" height="4" rx="1" fill="#3d7bff"/>
    <text x="50" y="35" font-size="12"><tspan fill="#d5d9e0" letter-spacing="2">UNI OS</tspan><tspan fill="#646b78" dx="10">/ system map</tspan></text>
    <circle cx="652" cy="31" r="3.5" fill="#22e07a" class="ping"/>
    <circle cx="652" cy="31" r="3.5" fill="#22e07a"/>
    <text x="770" y="35" font-size="12" text-anchor="end"><tspan fill="#22e07a">live</tspan><tspan fill="#646b78"> · 14:32:07</tspan></text>
  </g>

  <!-- ===== uni-vm host frame ===== -->
  <rect x="28.5" y="60.5" width="535" height="426" rx="14" fill="#fff" fill-opacity=".012" stroke="rgba(255,255,255,.14)" stroke-dasharray="3 5"/>
  <g class="m">
    <!-- server glyph -->
    <rect x="44.5" y="74.5" width="13" height="5" rx="1.5" fill="none" stroke="#9aa1ad"/>
    <rect x="44.5" y="81.5" width="13" height="5" rx="1.5" fill="none" stroke="#9aa1ad"/>
    <circle cx="54" cy="77" r=".9" fill="#22e07a"/>
    <circle cx="54" cy="84" r=".9" fill="#22e07a"/>
    <text x="66" y="85" font-size="12"><tspan fill="#d5d9e0">uni-vm</tspan><tspan fill="#7d8592"> · GCP</tspan></text>
    <text x="548" y="85" font-size="11" fill="#555c68" text-anchor="end">24/7 · systemd · tmux</text>
  </g>

  <!-- tmux status line -->
  <rect x="40.5" y="452.5" width="511" height="22" rx="5" fill="#22e07a" fill-opacity=".07" stroke="#22e07a" stroke-opacity=".2"/>
  <text class="m" x="50" y="467.5" font-size="11"><tspan fill="#22e07a">[uni]</tspan><tspan fill="#8b93a0"> 6 sessions · self-resume on</tspan></text>
  <text class="m" x="542" y="467.5" font-size="11" fill="#646b78" text-anchor="end">~15 jobs · 14:32</text>

  <!-- ===== edges (hairlines) ===== -->
  <g>
    <use href="#e-plan" xlink:href="#e-plan" class="ln"/>
    <use href="#e-dm" xlink:href="#e-dm" class="ln"/>
    <use href="#e-trk" xlink:href="#e-trk" class="ln"/>
    <use href="#e-ad" xlink:href="#e-ad" class="ln"/>
    <use href="#e-ep" xlink:href="#e-ep" class="ln"/>
    <use href="#e-la" xlink:href="#e-la" class="ln"/>
    <use href="#e-sync" xlink:href="#e-sync" class="ln"/>
    <use href="#e-vault" xlink:href="#e-vault" class="ln"/>
    <use href="#e-git" xlink:href="#e-git" class="ln"/>
    <use href="#e-ntfy" xlink:href="#e-ntfy" class="ln push"/>
  </g>

  <!-- ===== packets (drawn under the nodes so they slip in and out of them) ===== -->
  <g>
    <use href="#e-plan" xlink:href="#e-plan" class="pk h" style="animation-delay:-.2s"/>
    <use href="#e-plan" xlink:href="#e-plan" class="pk c" style="animation-delay:-.2s"/>
    <use href="#e-trk" xlink:href="#e-trk" class="pk h rev" style="animation-delay:-1.3s"/>
    <use href="#e-trk" xlink:href="#e-trk" class="pk c rev" style="animation-delay:-1.3s"/>
    <use href="#e-ad" xlink:href="#e-ad" class="pk h" style="animation-delay:-2.6s"/>
    <use href="#e-ad" xlink:href="#e-ad" class="pk c" style="animation-delay:-2.6s"/>
    <use href="#e-dm" xlink:href="#e-dm" class="pk h rev" style="animation-delay:-3.4s;animation-duration:5.6s"/>
    <use href="#e-dm" xlink:href="#e-dm" class="pk c rev" style="animation-delay:-3.4s;animation-duration:5.6s"/>
    <use href="#e-la" xlink:href="#e-la" class="pk h" style="animation-delay:-.9s;animation-duration:4.8s"/>
    <use href="#e-la" xlink:href="#e-la" class="pk c" style="animation-delay:-.9s;animation-duration:4.8s"/>
    <use href="#e-ep" xlink:href="#e-ep" class="pk h rev" style="animation-delay:-2.1s;animation-duration:5s"/>
    <use href="#e-ep" xlink:href="#e-ep" class="pk c rev" style="animation-delay:-2.1s;animation-duration:5s"/>
    <use href="#e-sync" xlink:href="#e-sync" class="pk h" style="animation-delay:-1.7s;animation-duration:3.6s"/>
    <use href="#e-sync" xlink:href="#e-sync" class="pk c" style="animation-delay:-1.7s;animation-duration:3.6s"/>
    <use href="#e-vault" xlink:href="#e-vault" class="pk h" style="animation-delay:-.4s;animation-duration:3.6s"/>
    <use href="#e-vault" xlink:href="#e-vault" class="pk c" style="animation-delay:-.4s;animation-duration:3.6s"/>
    <use href="#e-git" xlink:href="#e-git" class="pk h" style="animation-delay:-2.4s;animation-duration:7.2s"/>
    <use href="#e-git" xlink:href="#e-git" class="pk c" style="animation-delay:-2.4s;animation-duration:7.2s"/>
    <use href="#e-ntfy" xlink:href="#e-ntfy" class="pk h am" style="animation-delay:-3s;animation-duration:6.4s"/>
    <use href="#e-ntfy" xlink:href="#e-ntfy" class="pk c am" style="animation-delay:-3s;animation-duration:6.4s"/>
  </g>

  <!-- frame ports where edges leave the VM (reference-style handles) -->
  <g fill="#0c0d10" stroke="#3d7bff" stroke-width="1.2">
    <rect x="560.5" y="178.5" width="7" height="7" rx="1"/>
    <rect x="560.5" y="261.5" width="7" height="7" rx="1"/>
  </g>

  <!-- ===== coordinator hub ===== -->
  <circle cx="296" cy="265" r="170" fill="url(#uos-hubglow)"/>
  <!-- hub glow: stacked translucent strokes (a blur filter costs a full offscreen raster per paint) -->
  <g fill="none" stroke="#3d7bff">
    <rect x="218" y="231" width="156" height="68" rx="12" stroke-width="16" opacity=".05"/>
    <rect x="218" y="231" width="156" height="68" rx="12" stroke-width="9" opacity=".09"/>
    <rect x="218" y="231" width="156" height="68" rx="12" stroke-width="4" opacity=".22"/>
  </g>
  <rect x="218.5" y="231.5" width="155" height="67" rx="12" fill="url(#uos-hubfill)" stroke="#3d7bff" stroke-width="1.3"/>
  <!-- selection handles -->
  <g fill="#f3f4f6" stroke="#3d7bff" stroke-width="1">
    <rect x="215.5" y="228.5" width="5" height="5"/>
    <rect x="371.5" y="228.5" width="5" height="5"/>
    <rect x="215.5" y="296.5" width="5" height="5"/>
    <rect x="371.5" y="296.5" width="5" height="5"/>
  </g>
  <text class="s" x="296" y="263" font-size="17" font-weight="600" fill="#fff" text-anchor="middle" letter-spacing="-.2">coordinator</text>
  <text class="m" x="296" y="282" font-size="11" fill="#8fb0ff" text-anchor="middle">routes · reviews</text>
  <circle cx="361" cy="244" r="3" fill="#22e07a" class="ping"/>
  <circle cx="361" cy="244" r="3" fill="#22e07a"/>

