  <!-- this week: stacked study hours per course (20px = 1h) -->
  <text class="m cap" x="266" y="442">THIS WEEK</text>
  <text class="s" x="570" y="442" font-size="12" font-weight="600" style="fill:#c7ccd4" text-anchor="end">12h 45m</text>
  <path d="M266 540.5h304" stroke="#fff" stroke-opacity=".08"/>
  <g>
    <!-- Mon -->
    <rect x="278" y="510" width="20" height="30" rx="2" fill="#3d7bff"/>
    <rect x="278" y="488" width="20" height="20" rx="2" fill="#ffb020"/>
    <rect x="278" y="476" width="20" height="10" rx="2" fill="#22e07a"/>
    <!-- Tue -->
    <rect x="321" y="520" width="20" height="20" rx="2" fill="#9d6bff"/>
    <rect x="321" y="498" width="20" height="20" rx="2" fill="#3d7bff"/>
    <!-- Wed -->
    <rect x="364" y="510" width="20" height="30" rx="2" fill="#ffb020"/>
    <rect x="364" y="488" width="20" height="20" rx="2" fill="#22e07a"/>
    <rect x="364" y="476" width="20" height="10" rx="2" fill="#9d6bff"/>
    <!-- Thu -->
    <rect x="407" y="500" width="20" height="40" rx="2" fill="#3d7bff"/>
    <rect x="407" y="478" width="20" height="20" rx="2" fill="#9d6bff"/>
    <rect x="407" y="466" width="20" height="10" rx="2" fill="#ffb020"/>
    <!-- Fri (today, in progress) -->
    <rect x="449.5" y="459.5" width="21" height="81" rx="3" fill="none" stroke="#fff" stroke-opacity=".12" stroke-dasharray="2 3"/>
    <rect x="450" y="525" width="20" height="15" rx="2" fill="#ffb020"/>
    <rect x="450" y="513" width="20" height="10" rx="2" fill="#3d7bff"/>
    <!-- Sat / Sun -->
