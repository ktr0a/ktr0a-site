  <text class="m" x="600" y="512" font-size="10.5" style="fill:#646b78">tokens <tspan fill="#9aa1ad">1.2k</tspan> · <tspan fill="#9aa1ad">$0.004</tspan></text>
  <rect x="600.5" y="524.5" width="161" height="33" rx="9" fill="#fff" fill-opacity=".03" stroke="#fff" stroke-opacity=".12"/>
  <rect class="caret" x="610" y="534" width="1.6" height="14" fill="#3d7bff"/>
  <text class="s" x="617" y="545.5" font-size="12" style="fill:#555c68">Ask your notes…</text>
  <circle cx="746" cy="541" r="10" fill="#3d7bff"/>
  <path d="M746 546.5v-10M741.8 540.5l4.2-4.2 4.2 4.2" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
