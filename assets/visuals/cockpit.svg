<svg xmlns="http://www.w3.org/2000/svg" id="still" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="ck-t ck-d">
  <title id="ck-t">Uni Cockpit dashboard</title>
  <desc id="ck-d">Mock-up of the Uni Cockpit Obsidian plugin in Dashboard view: today's agenda on the left (A&amp;D lecture, LA exercise in progress, EProg lab, DM lecture, a sheet deadline), course cards with progress bars and a weekly study chart in the centre, and a Claude side panel with a short question and answer and a token and cost footer.</desc>
  <!--
    Hand-authored illustration for the Uni Cockpit project card (ktr0a.dev).
    Self-contained: no scripts, no external refs. CSS-only animation (ping, caret,
    typing dots, one-shot progress fill). Load as "cockpit.svg#still" to freeze it.
  -->
  <defs>
    <style>
      .m{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .s{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .cap{font-size:11px;letter-spacing:1.6px;fill:#646b78}
      .meta{font-size:10.5px;fill:#4f5562}
      .evt{font-size:13.5px;font-weight:600;fill:#eceef2}
      .evs{font-size:10.5px;fill:#7d8592}
      .tm{font-size:12px;fill:#9aa1ad}
      .ec{fill:#fff;fill-opacity:.025;stroke:#fff;stroke-opacity:.07}
      .cc{fill:#13151a;stroke:#fff;stroke-opacity:.09}
      .code{font-size:16px;font-weight:700;fill:#f3f4f6;letter-spacing:-.2px}
      .cname{font-size:11.5px;fill:#8b93a0}
      .trk{fill:#fff;fill-opacity:.07}
      .msg{font-size:12px;fill:#c9ced6}

      .ping{transform-box:fill-box;transform-origin:center;animation:ping 2.6s ease-out infinite}
      @keyframes ping{0%{transform:scale(1);opacity:.7}70%,100%{transform:scale(3.2);opacity:0}}
      .caret{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .td{animation:td 1.4s ease-in-out infinite}
      @keyframes td{0%,80%,100%{opacity:.25}40%{opacity:1}}
      /* progress fills grow once when the image first renders */
      .fill{transform-box:fill-box;transform-origin:left center;animation:grow 1.4s cubic-bezier(.2,.7,.2,1) .25s backwards}
      @keyframes grow{from{transform:scaleX(0)}}

      #still:target *{animation:none!important}
    </style>
    <radialGradient id="ck-bg" cx="200" cy="80" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141a28"/>
      <stop offset=".5" stop-color="#0d0f13"/>
      <stop offset="1" stop-color="#0a0b0d"/>
    </radialGradient>
    <linearGradient id="ck-logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c9bff"/>
      <stop offset="1" stop-color="#2a5fe0"/>
    </linearGradient>
    <linearGradient id="ck-win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121318"/>
      <stop offset="1" stop-color="#0e0f13"/>
    </linearGradient>
    <pattern id="ck-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".9" fill="#fff" fill-opacity=".045"/>
    </pattern>
    <clipPath id="ck-winclip"><rect x="25" y="31" width="750" height="542" rx="13.5"/></clipPath>
  </defs>

  <!-- ===== backdrop ===== -->
  <rect width="800" height="600" fill="url(#ck-bg)"/>
  <rect width="800" height="600" fill="url(#ck-dots)"/>

  <!-- ===== window ===== -->
  <rect x="24.5" y="30.5" width="751" height="543" rx="14" fill="url(#ck-win)"/>
  <g clip-path="url(#ck-winclip)">
    <!-- Claude side panel surface -->
    <rect x="586" y="108" width="190" height="466" fill="#14161c"/>
    <!-- title bar -->
    <rect x="24" y="30" width="752" height="30" fill="#0b0c0f"/>
  </g>
  <g fill="#fff" fill-opacity=".13">
    <circle cx="44" cy="45" r="4.5"/>
    <circle cx="59" cy="45" r="4.5"/>
    <circle cx="74" cy="45" r="4.5"/>
  </g>
  <text class="m" x="400" y="49" font-size="11" style="fill:#4f5562" text-anchor="middle">uni-vault — Uni Cockpit</text>
  <g stroke="#fff" stroke-opacity=".08">
    <path d="M24 60.5h752M24 108.5h752M250.5 109v465M586.5 109v465"/>
  </g>
  <rect x="24.5" y="30.5" width="751" height="543" rx="14" fill="none" stroke="#fff" stroke-opacity=".13"/>

  <!-- ===== plugin header ===== -->
  <rect x="42" y="72" width="24" height="24" rx="7" fill="url(#ck-logo)"/>
  <g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round">
    <path d="M48.5 88a5.5 5.5 0 0 1 11 0"/>
    <path d="M54 88l3-4"/>
  </g>
  <text class="s" x="76" y="89" font-size="15" font-weight="600" style="fill:#f3f4f6" letter-spacing="-.2">Uni Cockpit</text>

  <!-- Focus | Dashboard | Agenda -->
  <rect x="288.5" y="72.5" width="223" height="25" rx="8" fill="#fff" fill-opacity=".035" stroke="#fff" stroke-opacity=".1"/>
  <rect x="352" y="75" width="86" height="20" rx="6" fill="#f3f4f6"/>
  <g class="s" font-size="12.5" text-anchor="middle">
    <text x="320" y="89.5" fill="#9aa1ad" font-weight="500">Focus</text>
    <text x="395" y="89.5" fill="#0b0c0f" font-weight="600">Dashboard</text>
    <text x="475" y="89.5" fill="#9aa1ad" font-weight="500">Agenda</text>
  </g>
  <text x="756" y="89" text-anchor="end"><tspan class="s" font-size="13" fill="#c7ccd4">Fri 6 Nov</tspan><tspan class="m" font-size="12" fill="#646b78" dx="9">11:02</tspan></text>

  <!-- ===== left: today ===== -->
  <text class="m cap" x="40" y="136">TODAY</text>
  <text class="m meta" x="234" y="136" text-anchor="end">5 items</text>
  <path d="M86.5 160V454" stroke="#fff" stroke-opacity=".07"/>

  <!-- 08:15 A&D lecture (past) -->
  <g opacity=".42">
    <text class="m tm" x="40" y="172">08:15</text>
    <circle cx="86.5" cy="168" r="4" fill="#0f1014" stroke="#3d7bff" stroke-width="1.5"/>
    <rect class="ec" x="98.5" y="152.5" width="136" height="49" rx="8"/>
    <rect x="107" y="161" width="3" height="32" rx="1.5" fill="#3d7bff"/>
    <text class="s evt" x="118" y="173">A&amp;D lecture</text>
    <text class="m evs" x="118" y="189">08:15–10:00</text>
  </g>

  <!-- 10:15 LA exercise (now) -->
  <g>
    <text class="m tm" x="40" y="234" style="fill:#ffb020">10:15</text>
    <circle cx="86.5" cy="230" r="4" fill="#ffb020" class="ping"/>
    <circle cx="86.5" cy="230" r="4" fill="#ffb020"/>
    <rect x="98.5" y="214.5" width="136" height="49" rx="8" fill="#ffb020" fill-opacity=".07" stroke="#ffb020" stroke-opacity=".38"/>
    <rect x="107" y="223" width="3" height="32" rx="1.5" fill="#ffb020"/>
    <text class="s evt" x="118" y="235">LA exercise</text>
    <text class="m evs" x="118" y="249"><tspan fill="#ffb020">now</tspan> · until 12:00</text>
    <rect class="trk" x="118" y="254" width="104" height="2.5" rx="1.25"/>
    <rect class="fill" x="118" y="254" width="47" height="2.5" rx="1.25" fill="#ffb020"/>
  </g>

  <!-- 14:00 EProg lab -->
  <g>
    <text class="m tm" x="40" y="296">14:00</text>
    <circle cx="86.5" cy="292" r="4" fill="#0f1014" stroke="#22e07a" stroke-width="1.5"/>
    <rect class="ec" x="98.5" y="276.5" width="136" height="49" rx="8"/>
    <rect x="107" y="285" width="3" height="32" rx="1.5" fill="#22e07a"/>
    <text class="s evt" x="118" y="297">EProg lab</text>
    <text class="m evs" x="118" y="313">14:00–16:00</text>
  </g>

  <!-- 16:15 DM lecture -->
  <g>
    <text class="m tm" x="40" y="358">16:15</text>
    <circle cx="86.5" cy="354" r="4" fill="#0f1014" stroke="#9d6bff" stroke-width="1.5"/>
    <rect class="ec" x="98.5" y="338.5" width="136" height="49" rx="8"/>
    <rect x="107" y="347" width="3" height="32" rx="1.5" fill="#9d6bff"/>
    <text class="s evt" x="118" y="359">DM lecture</text>
    <text class="m evs" x="118" y="375">16:15–18:00</text>
  </g>

  <!-- 23:59 deadline -->
  <g>
    <text class="m tm" x="40" y="420" style="fill:#ff8a1f">23:59</text>
    <path d="M83 409.5v12M83.5 410h7l-2 2.6 2 2.6h-7" fill="#ff8a1f" fill-opacity=".25" stroke="#ff8a1f" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="98.5" y="400.5" width="136" height="49" rx="8" fill="none" stroke="#ff8a1f" stroke-opacity=".35" stroke-dasharray="3 3"/>
    <rect x="107" y="409" width="3" height="32" rx="1.5" fill="#ff8a1f"/>
    <text class="s evt" x="118" y="421">Sheet 7 due</text>
    <text class="m evs" x="118" y="437">A&amp;D · 3/5 done</text>
  </g>

  <!-- next-up chip -->
  <rect x="40.5" y="510.5" width="194" height="30" rx="8" fill="#fff" fill-opacity=".03" stroke="#fff" stroke-opacity=".08"/>
  <circle cx="55" cy="525.5" r="3" fill="#22e07a"/>
  <text class="m" x="66" y="529.5" font-size="10.5" style="fill:#8b93a0">next · EProg in 2h 58m</text>

  <!-- ===== centre: courses ===== -->
  <text class="m cap" x="266" y="136">COURSES</text>
  <text class="m meta" x="570" y="136" text-anchor="end">HS26 · week 8</text>

  <!-- A&D -->
  <g transform="translate(266 152)">
    <rect class="cc" x=".5" y=".5" width="145" height="123" rx="10"/>
    <rect x="14" y="16" width="10" height="10" rx="3" fill="#3d7bff"/>
    <text class="s code" x="31" y="26">A&amp;D</text>
    <text class="m meta" x="132" y="25" text-anchor="end">sheet 7</text>
    <text class="s cname" x="14" y="47">Algorithms &amp; DS</text>
    <text class="m evs" x="14" y="77" style="fill:#646b78">exercises</text>
    <text class="m" x="132" y="77" font-size="10.5" style="fill:#c7ccd4" text-anchor="end">58%</text>
    <rect class="trk" x="14" y="84" width="118" height="5" rx="2.5"/>
    <rect class="fill" x="14" y="84" width="68" height="5" rx="2.5" fill="#3d7bff"/>
    <text class="m evs" x="14" y="110" style="fill:#ff8a1f">due today 23:59</text>
  </g>
  <!-- DM -->
  <g transform="translate(424 152)">
    <rect class="cc" x=".5" y=".5" width="145" height="123" rx="10"/>
    <rect x="14" y="16" width="10" height="10" rx="3" fill="#9d6bff"/>
    <text class="s code" x="31" y="26">DM</text>
    <text class="m meta" x="132" y="25" text-anchor="end">sheet 6</text>
    <text class="s cname" x="14" y="47">Discrete Maths</text>
    <text class="m evs" x="14" y="77" style="fill:#646b78">exercises</text>
    <text class="m" x="132" y="77" font-size="10.5" style="fill:#c7ccd4" text-anchor="end">46%</text>
    <rect class="trk" x="14" y="84" width="118" height="5" rx="2.5"/>
    <rect class="fill" x="14" y="84" width="54" height="5" rx="2.5" fill="#9d6bff" style="animation-delay:.35s"/>
    <text class="m evs" x="14" y="110" style="fill:#646b78">lecture 16:15</text>
  </g>
  <!-- LA -->
  <g transform="translate(266 288)">
    <rect class="cc" x=".5" y=".5" width="145" height="123" rx="10"/>
    <rect x="14" y="16" width="10" height="10" rx="3" fill="#ffb020"/>
    <text class="s code" x="31" y="26">LA</text>
    <text class="m meta" x="132" y="25" text-anchor="end">sheet 6</text>
    <text class="s cname" x="14" y="47">Linear Algebra</text>
    <text class="m evs" x="14" y="77" style="fill:#646b78">exercises</text>
    <text class="m" x="132" y="77" font-size="10.5" style="fill:#c7ccd4" text-anchor="end">64%</text>
    <rect class="trk" x="14" y="84" width="118" height="5" rx="2.5"/>
    <rect class="fill" x="14" y="84" width="76" height="5" rx="2.5" fill="#ffb020" style="animation-delay:.45s"/>
    <text class="m evs" x="14" y="110" style="fill:#ffb020">exercise · now</text>
  </g>
  <!-- EProg -->
  <g transform="translate(424 288)">
    <rect class="cc" x=".5" y=".5" width="145" height="123" rx="10"/>
    <rect x="14" y="16" width="10" height="10" rx="3" fill="#22e07a"/>
    <text class="s code" x="31" y="26">EProg</text>
    <text class="m meta" x="132" y="25" text-anchor="end">lab 5</text>
    <text class="s cname" x="14" y="47">Intro Programming</text>
    <text class="m evs" x="14" y="77" style="fill:#646b78">exercises</text>
    <text class="m" x="132" y="77" font-size="10.5" style="fill:#c7ccd4" text-anchor="end">71%</text>
    <rect class="trk" x="14" y="84" width="118" height="5" rx="2.5"/>
    <rect class="fill" x="14" y="84" width="84" height="5" rx="2.5" fill="#22e07a" style="animation-delay:.55s"/>
    <text class="m evs" x="14" y="110" style="fill:#646b78">lab 14:00</text>
