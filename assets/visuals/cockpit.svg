    <rect x="536" y="537" width="20" height="3" rx="1.5" fill="#fff" fill-opacity=".08"/>
  </g>
  <g class="m" font-size="10" fill="#4f5562" text-anchor="middle">
    <text x="288" y="557">M</text><text x="331" y="557">T</text><text x="374" y="557">W</text><text x="417" y="557">T</text>
    <text x="460" y="557" fill="#f3f4f6">F</text><text x="503" y="557">S</text><text x="546" y="557">S</text>
  </g>

  <!-- ===== right: Claude side panel ===== -->
  <path d="M606 126v12M600 132h12M601.8 127.8l8.4 8.4M601.8 136.2l8.4-8.4" stroke="#ff8a1f" stroke-width="1.7" stroke-linecap="round"/>
  <text class="s" x="619" y="137" font-size="13.5" font-weight="600" style="fill:#eceef2">Claude</text>
  <rect x="716.5" y="124.5" width="45" height="17" rx="8.5" fill="none" stroke="#fff" stroke-opacity=".14"/>
  <text class="m" x="739" y="136.5" font-size="10" style="fill:#9aa1ad" text-anchor="middle">haiku</text>

  <!-- question -->
  <rect x="610" y="158" width="152" height="46" rx="11" fill="#fff" fill-opacity=".07"/>
  <text class="s msg" x="622" y="177" style="fill:#eceef2">Why is det(A) = 0</text>
  <text class="s msg" x="622" y="194" style="fill:#eceef2">if A isn’t invertible?</text>

  <!-- answer -->
  <g class="s msg">
    <text x="600" y="228">Hint: <tspan class="m" font-size="11.5" fill="#8fb0ff">det(A)</tspan> is the factor</text>
    <text x="600" y="246">by which A scales volume.</text>
    <text x="600" y="264">If A isn’t invertible it</text>
    <text x="600" y="282">flattens space into a lower</text>
    <text x="600" y="300">dimension, so volume is 0.</text>
  </g>
  <rect x="600.5" y="312.5" width="98" height="19" rx="6" fill="#fff" fill-opacity=".03" stroke="#fff" stroke-opacity=".1"/>
  <text class="m" x="609" y="325.5" font-size="10" style="fill:#8b93a0">↳ LA/lec-09.md</text>

  <!-- follow-up, answer streaming -->
  <rect x="626" y="352" width="136" height="28" rx="11" fill="#fff" fill-opacity=".07"/>
  <text class="s msg" x="638" y="370" style="fill:#eceef2">Show it for 3×3?</text>
  <g fill="#9aa1ad">
