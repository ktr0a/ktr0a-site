    <circle class="td" cx="613" cy="402" r="2.6" style="animation-delay:.18s"/>
    <circle class="td" cx="622" cy="402" r="2.6" style="animation-delay:.36s"/>
  </g>
  <text class="m" x="634" y="405.5" font-size="10" style="fill:#646b78">sonnet · thinking</text>

